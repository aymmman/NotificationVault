name: Build Android APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack uploaded ZIP (if the project was uploaded as a zip)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Project files found at the repo root — no zip to unpack."
            exit 0
          fi
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "::error::No settings.gradle.kts and no .zip found at the repository root. Upload the project zip to the root of the repo."
            exit 1
          fi
          echo "Unpacking $ZIP"
          rm -rf /tmp/project && mkdir -p /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          ROOT=$(dirname "$(find /tmp/project -maxdepth 3 -name settings.gradle.kts -print | head -n 1)")
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "::error::The zip does not contain settings.gradle.kts"
            exit 1
          fi
          echo "Project root inside zip: $ROOT"
          shopt -s dotglob
          cp -R "$ROOT"/* .
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          OUT="NotificationVault-debug-${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificationVault-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Notification Vault build ${{ github.run_number }}
          prerelease: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Debug build from commit ${{ github.sha }}.
            Install: download the .apk on your phone, open it, and allow "Install unknown apps" when asked.

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Notification Vault"
            echo "- APK: **${{ steps.apk.outputs.path }}** (see Releases → build-${{ github.run_number }})"
            echo "- Unit tests: **${{ steps.tests.outcome }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: signed release bundle for Google Play (runs only if these secrets exist)
      - name: Build signed release bundle (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          NV_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NV_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NV_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NV_VERSION_CODE: ${{ github.run_number }}
        if: env.HAS_KEYSTORE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export NV_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release bundle
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NotificationVault-release-aab
          path: app/build/outputs/bundle/release/*.aab
